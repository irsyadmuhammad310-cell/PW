<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FinTrack v12.0.0</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles/theme.css">
  <link rel="stylesheet" href="styles/main.css">
</head>
<body>
  <div class="app" id="app">
    <aside class="sb" id="sb">
      <div class="sb-brand">
        <div class="sb-icon"><i data-lucide="wallet" width="18" height="18"></i></div>
        <h1>FinTrack</h1>
      </div>
      <nav class="sb-nav"></nav>
    </aside>
    <main class="main">
      <header class="top-header">
        <div class="header-left"></div>
        <div class="header-right"></div>
      </header>
      <div class="content" id="cnt"></div>
    </main>
  </div>

  <div id="toast" class="toast"></div>

  <!-- External Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/lucide@0.383.0/dist/umd/lucide.min.js"></script>

  <!-- App Scripts -->
  <script src="scripts/config.js"></script>
  <script src="scripts/storage.js"></script>
  <script src="scripts/state.js"></script>
  <script src="scripts/helpers.js"></script>
  <script src="scripts/modules/dashboard.js"></script>
  <script src="scripts/modules/transactions.js"></script>
  <script src="scripts/modules/investments.js"></script>
  <script src="scripts/modules/goals.js"></script>
  <script src="scripts/modules/analytics.js"></script>
  <script src="scripts/modules/reports.js"></script>
  <script src="scripts/modules/settings.js"></script>
  <script src="scripts/app.js"></script>
</body>
</html>
